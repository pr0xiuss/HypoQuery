version: "3.9"

services:
  postgres:
    image: postgres:16

    container_name: hypoquery_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pr0xy
      POSTGRES_DB: hypoquery

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: